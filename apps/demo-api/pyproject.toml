[project]
name = "demo-api"
version = "0.1.0"
description = "Reference service for the golden-path pipeline and the AKS platform."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.7",
  "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --cov=demo_api --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`:Warning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S104"] # binding 0.0.0.0 is intended inside a container

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
files = ["src"]
